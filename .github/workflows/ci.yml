name: Vegam Enterprise CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.0.0
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      - name: Type Check (TypeScript)
        run: pnpm run type-check

  unit-integration-tests:
    name: Jest Core & Integration Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.0.0
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build packages (Dependency for testing)
        run: pnpm run build
      - name: Run Jest Test Suite (Unit & Integration)
        run: pnpm test
        env:
          RABBITMQ_URI: amqp://localhost:5672
      - name: Execute headless CLI verification & SARIF audit
        run: |
          node packages/cli/dist/cli.js run --template ecommerce-checkout-v1 --rate 200 --duration 3
          node packages/cli/dist/cli.js export --template fintech-fraud-surprisal-v1 --output vegam-ci-audit.sarif --format sarif
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@b611370bf08527e5ed15e21e4221a0ce3c4c8182 # v3.25.11
        with:
          sarif_file: vegam-ci-audit.sarif

  e2e-tests:
    name: Playwright E2E UI Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.0.0
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build Web App
        run: pnpm run build
      - name: Install Playwright Browsers
        run: pnpm --filter @vegam/studio exec playwright install --with-deps
      - name: Run Playwright Tests
        run: pnpm --filter @vegam/studio run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        if: always()
        with:
          name: playwright-report
          path: packages/studio/playwright-report/
          retention-days: 14

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Studio Image
        run: docker compose -f docker-compose.yml build
